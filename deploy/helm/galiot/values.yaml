# Galiot — self-hosted S3 file browser (SPA + Bun signing server).
#
# The server signs every S3 request and opens the connection, so the NODES
# running these pods must be able to reach your S3 endpoint (DNS, port, TLS).
# There is no server-side state and no volume: credentials live in each user's
# browser vault; server sessions and share grants are memory-only.
#
# Quick start (gate required for a non-loopback bind — the server refuses to
# start without one):
#   helm install galiot deploy/helm/galiot \
#     --set gate.value="$(openssl rand -hex 24)"
#
# Prefer an existing Secret in production:
#   kubectl create secret generic galiot-gate --from-literal=gate="$(openssl rand -hex 24)"
#   helm install galiot deploy/helm/galiot --set gate.existingSecret=galiot-gate

# -- Number of replicas. KEEP AT 1 unless you understand the consequences:
# sessions and share-link grants live in ONE pod's memory. With >1 replica,
# a share link minted on pod A returns 404 on pod B, and operator sessions
# bounce between pods (the client retries, but transfers degrade). There is
# no shared session store and no HPA in this chart on purpose.
replicaCount: 1

image:
  # -- Published by .github/workflows/release.yml on version tags.
  repository: ghcr.io/fiztoz/galiot
  # -- Overrides the image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Optional digest pin (e.g. sha256:abc...). Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Pull secrets for a private registry mirror.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The access gate protects the Galiot API (/api/s3). It is NOT an S3 key.
# Exactly one of: gate.value, gate.existingSecret, or gate.open.
gate:
  # -- Gate token rendered into a chart-managed Secret. Stored in the Helm
  # release record; fine for trials, prefer existingSecret for production.
  value: ""
  # -- Name of a pre-existing Secret holding the gate token.
  existingSecret: ""
  # -- Key inside gate.existingSecret.
  existingSecretKey: "gate"
  # -- DANGER: set GALIOT_GATE_OPEN=1 and accept an UNAUTHENTICATED public
  # signing proxy. Anyone who can reach the pod can use your server to sign
  # requests with credentials they supply. Only for isolated test networks.
  open: false

# White-label: custom name and logo, applied at runtime — no image rebuild.
# The server injects the brand into the page title, favicon, PWA manifest and
# the UI. Changes require a pod restart (helm upgrade rolls them).
branding:
  # -- Display name (GALIOT_BRAND_NAME), max 64 chars. Empty keeps "Galiot".
  name: ""
  # -- Tagline (GALIOT_BRAND_TAGLINE) after the em dash in the browser title,
  # max 96 chars. Empty keeps "The Agile Cloud Explorer". To remove the
  # tagline entirely, use extraEnv with an empty GALIOT_BRAND_TAGLINE value.
  tagline: ""
  logo:
    # -- Inline SVG markup. The chart creates a ConfigMap and mounts it.
    # Example: '<svg viewBox="0 0 32 32">…</svg>'
    svg: ""
    # -- Or mount an existing ConfigMap holding the logo file (svg, png, jpg,
    # jpeg, webp, gif or ico; ≤1 MiB). Create it with:
    #   kubectl create configmap acme-logo --from-file=logo.png=./logo.png
    existingConfigMap: ""
    # -- Key inside existingConfigMap. The extension sets the content type.
    key: "logo.svg"

# Preset connection defaults for company deployments: the "Add connection"
# form starts pre-filled with these values. Fields stay editable; presets
# never contain credentials. Applied at runtime — no image rebuild.
preset:
  # -- Company S3 endpoint (GALIOT_PRESET_ENDPOINT), e.g. https://s3.example.com.
  # Must be an absolute http(s) URL without embedded credentials; the server
  # screens it at startup and refuses to start on a bad value.
  endpoint: ""
  # -- Default region (GALIOT_PRESET_REGION). Empty keeps us-east-1.
  region: ""
  # -- Start new connections with path-style addressing
  # (GALIOT_PRESET_PATH_STYLE=1). Most on-premises gateways need this.
  pathStyle: false

serviceAccount:
  create: true
  # -- Name override. Defaults to the release fullname.
  name: ""
  annotations: {}
  # The app never talks to the Kubernetes API.
  automountServiceAccountToken: false

service:
  type: ClusterIP
  # -- Also the container's listen port (GALIOT_PORT). Must be >=1024: the
  # container runs as non-root uid 1000 and cannot bind privileged ports.
  port: 8788
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx: uploads stream through the server (up to 1 GiB per object).
    # The default 1m body limit WILL break uploads — disable or raise it:
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    # RFC 2606 placeholder — replace with your own hostname.
    - host: galiot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: galiot-tls
    #   hosts:
    #     - galiot.example.com

# Gateway API (the Ingress successor). Requires the Gateway API CRDs
# (standard channel) installed in the cluster: https://gateway-api.sigs.k8s.io
# Renders an HTTPRoute attaching to your existing Gateway(s). TLS is the
# Gateway listener's job. Can be used instead of or alongside ingress above.
gateway:
  enabled: false
  # -- Gateways this route attaches to; at least one when enabled.
  parentRefs:
    - name: my-gateway
      # namespace: gateway-system  # cross-namespace needs referenceGrant below
      # sectionName: https         # attach to one specific listener
      # port: 443
  # -- Hostnames to match. Empty list matches all hosts on the listener.
  hostnames:
    - galiot.example.com
  # -- Extra HTTPRoute rules (filters, timeouts, matches) appended after the
  # default catch-all rule. Passthrough — rendered as-is.
  extraRules: []
  # -- ReferenceGrant for cross-namespace attachment. It is created in the
  # GATEWAY's namespace (not the release namespace), so the installer needs
  # permission there. Only needed when a parentRef.namespace is set.
  referenceGrant:
    create: false
    # -- Namespace of the Gateway; required when create is true.
    namespace: ""

# -- Pod-level security context. uid/gid 1000 is the `bun` user in oven/bun.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The server writes nothing to disk;
# /tmp is an emptyDir and HOME points at it.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit: avoid throttling long transfers. Raise memory if you
    # proxy many concurrent large objects.
    memory: 512Mi

# -- Extra environment variables, e.g. future GALIOT_* server settings.
# List of {name, value} or {name, valueFrom}.
extraEnv: []

# -- Extra volumes/mounts, e.g. a private CA bundle for a derived image.
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

pdb:
  # -- With replicaCount 1, minAvailable 1 BLOCKS node drains. For a
  # single replica use maxUnavailable: 1 instead, or leave this disabled.
  create: false
  minAvailable: 1
  # -- Overrides minAvailable when set (e.g. 1).
  maxUnavailable: ""

networkPolicy:
  enabled: false
  # -- Sources allowed to reach the HTTP port. Default [{}] allows all
  # sources; restrict to your ingress controller, e.g.:
  # ingressFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx
  ingressFrom:
    - {}
  # Egress is intentionally unrestricted: the server must reach arbitrary
  # S3 endpoints plus cluster DNS. Restrict it yourself if your endpoints
  # are fixed and you know their address ranges.
