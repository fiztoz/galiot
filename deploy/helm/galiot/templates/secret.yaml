{{- if and .Values.gate.value (not .Values.gate.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "galiot.gateSecretName" . }}
  labels:
    {{- include "galiot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "galiot.gateSecretKey" . }}: {{ .Values.gate.value | toString | trim | quote }}
{{- end }}
