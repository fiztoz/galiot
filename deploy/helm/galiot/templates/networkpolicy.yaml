{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $manageEgress := not (kindIs "invalid" $egress) }}
{{- if and $manageEgress (not (kindIs "slice" $egress)) }}
{{- fail "networkPolicy.egress must be null or a list of Kubernetes egress rules." }}
{{- end }}
{{- range $egress }}
{{- if not (kindIs "map" .) }}
{{- fail "Each networkPolicy.egress entry must be a Kubernetes egress rule." }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "galiot.fullname" . }}
  labels:
    {{- include "galiot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "galiot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $manageEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      {{- with .Values.networkPolicy.ingressFrom }}
      {{- /* The old default [{}] meant all sources. Kubernetes represents that by omitting from. */}}
      {{- if not (deepEqual . (list (dict))) }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
  {{- if $manageEgress }}
  egress: {{- toYaml $egress | nindent 4 }}
  {{- end }}
{{- end }}
