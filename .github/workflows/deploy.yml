name: CI

on:
  push:
    branches: [main]
  pull_request:

# `verify` holds no credentials and runs on every push and PR. `deploy` runs only
# on main and only after verify passes, so a red test suite can never ship.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs, not mutable tags: the deploy job exposes
      # CLOUDFLARE_API_TOKEN, and a hijacked tag would hand it over. Re-resolve
      # deliberately when bumping, e.g.
      #   gh api repos/actions/checkout/git/ref/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Source maps are opt-in (GALIOT_SOURCEMAPS=1) because Cloudflare Workers
      # Assets serves everything in dist/ publicly, with no Vercel-style .map
      # protection. Fail loudly rather than publish ~5 MB of readable source.
      - name: Assert no source maps in dist
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::dist/ contains .map files, which would be served publicly."
            exit 1
          fi

      - name: Assert the CSP headers file shipped
        run: test -f dist/_headers

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
