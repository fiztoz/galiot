name: Release

# Publishes the self-hosted container to GHCR when a version tag is pushed.
# No platform deploy: operators run this image on a host that can reach S3.
on:
  push:
    tags: ["v*"]

jobs:
  # A tag must pass the same checks as main before an image is published.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - name: Test
        timeout-minutes: 5
        run: bun test
      - run: bun run build

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned to commit SHAs, not mutable tags (same policy as CI).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Pre-release tags (v1.2.0-rc.1) must not move :latest.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Load first, smoke-test, then publish: a tag must pass the same
      # container checks main CI enforces before any image becomes public.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the loaded image
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"
          test "$(docker run --rm --entrypoint id "$image" -u)" != "0" || { echo "::error::image runs as root"; exit 1; }
          docker run -d --name galiot-release -e GALIOT_HOST=127.0.0.1 --network host "$image"
          trap 'docker rm -f galiot-release >/dev/null' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8788/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8788/api/health >/dev/null || { docker logs galiot-release; echo "::error::container did not answer /api/health"; exit 1; }
          headers=$(curl -sI http://127.0.0.1:8788/)
          echo "$headers" | grep -qi 'content-security-policy' || { echo "::error::missing CSP header"; exit 1; }
          echo "$headers" | grep -qi 'x-content-type-options' || { echo "::error::missing nosniff header"; exit 1; }
      - name: Publish the smoked image
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
