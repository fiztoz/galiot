<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Every CSP allows the optional companion only on 127.0.0.1:8787. The
      companion checks the page origin and a session token before forwarding
      any signed S3 request. Keep this value in sync with the response headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https: http://127.0.0.1:8787; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
    />
    <title>Galiot — The Agile Cloud Explorer</title>
    <meta name="description" content="A 100% client-side cloud storage explorer powered by PGlite WASM Postgres" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
