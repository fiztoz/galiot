<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defence in depth: the self-hosted server sends the same policy as a
      response header (src/server/securityHeaders.ts). releaseConfig.test.ts
      asserts the two match. S3 calls go to the same origin only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
    />
    <title>Galiot — The Agile Cloud Explorer</title>
    <meta name="description" content="A self-hosted S3 file browser: your server signs and connects to S3, your browser keeps the vault. PGlite WASM Postgres catalog, resumable transfers, in-browser editor." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
